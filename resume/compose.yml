name: resume

services:
  resume:
    image: wifsimster/resume:latest
    container_name: resume
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      disable: true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.resume.entrypoints=websecure"

      - "traefik.http.routers.resume.rule=Host(`cv.${DOMAIN}`)"

      - "traefik.http.services.resume.loadBalancer.server.port=80"

    networks:
      lan:

  chat:
    image: wifsimster/resume-chat:latest
    container_name: resume-chat
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=Europe/Paris
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - CHAT_API_BASE_URL=${CHAT_API_BASE_URL:-}
      - CHAT_API_KEY=${CHAT_API_KEY:-}
      - CHAT_MODEL=${CHAT_MODEL:-}
      - CHAT_LOG_DIR=${CHAT_LOG_DIR:-/data/logs}
      - CHAT_ADMIN_TOKEN=${CHAT_ADMIN_TOKEN:-}
    volumes:
      - ./chat-logs:/data/logs
    networks:
      lan:

networks:
  lan:
    external: true
