name: Unifi Controller
services:
  unifi:
    image: jacobalberty/unifi:v10.0
    container_name: unifi
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    init: true
    user: unifi
    healthcheck:
      test: ["CMD-SHELL", "curl --max-time 5 -kILs --fail https://localhost:8443"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    ports:
      - 3478:3478/udp
      - 5514:5514/udp
      - 6789:6789/tcp
      - 8080:8080/tcp
      - 8443:8443/tcp
      - 10001:10001/udp
      - 1900:1900/udp
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - /opt/docker/unifi:/unifi
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.unifi.entrypoints=websecure"

      - "traefik.http.routers.unifi.rule=Host(`unifi.${DOMAIN}`)"

      - "traefik.http.services.unifi.loadBalancer.server.port=8443"
      - "traefik.http.services.unifi.loadBalancer.server.scheme=https"
      - "traefik.http.services.unifi.loadBalancer.serversTransport=unifi@file"
      - "traefik.http.routers.unifi.middlewares=tinyauth@docker"

      - "com.centurylinklabs.watchtower.enable=true"

    networks:
      lan:
      
networks:
  lan:
    external: true

