name: orbite

services:
  orbite:
    image: ghcr.io/wifsimster/orbite:${ORBITE_IMAGE_TAG:?set ORBITE_IMAGE_TAG in .env}
    container_name: orbite
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - .env
    environment:
      - TZ=Europe/Paris
      - NODE_ENV=production
      - PORT=8080
      - HEALTH_PORT=8081
      - DATA_DIR=/data
      - ORBITE_PUBLIC_ORIGIN=https://orbite.${DOMAIN}
    volumes:
      - orbite-data:/data
    deploy:
      resources:
        limits:
          memory: 384M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.orbite.entrypoints=websecure"

      - "traefik.http.routers.orbite.rule=Host(`orbite.${DOMAIN}`)"
      - "traefik.http.routers.orbite.service=orbite"
      - "traefik.http.routers.orbite.middlewares=orbite-auth@docker,secHeaders@docker,orbite-proxy@file"

      - "traefik.http.services.orbite.loadBalancer.server.port=8080"

      - "traefik.http.middlewares.orbite-auth.forwardauth.address=http://tinyauth:3000/api/auth/traefik"
      - "traefik.http.middlewares.orbite-auth.forwardauth.authResponseHeaders=Remote-User"

    networks:
      lan:

volumes:
  orbite-data:
    name: orbite-data

networks:
  lan:
    external: true
