name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          fail=0
          for f in */compose.yml; do
            if ! (cd "$(dirname "$f")" && docker compose -f compose.yml config -q --no-interpolate); then
              echo "::error file=$f::docker compose config a échoué"
              fail=1
            fi
          done
          exit "$fail"

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S error
