name: birthday-invitation

services:
  birthday-invitation:
    image: ghcr.io/wifsimster/birthday-invitation:latest
    container_name: birthday-invitation
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - NODE_ENV=production
      - BIRTHDAY_PERSON=${BIRTHDAY_PERSON}
      - BIRTHDAY_AGE=${BIRTHDAY_AGE}
      - EVENT_DATE=${EVENT_DATE}
      - EVENT_TIME=${EVENT_TIME}
      - EVENT_TOWN=${EVENT_TOWN}
      - EVENT_LOCATION=${EVENT_LOCATION}
      - DRESS_CODE=${DRESS_CODE}
      - EVENT_RSVP_DEADLINE=${EVENT_RSVP_DEADLINE:-}
      - DB_PATH=/app/data/rsvp.db
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_NAME=${ADMIN_NAME:-Admin}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://birthday.${DOMAIN}}
      - MAIL_FROM=${MAIL_FROM}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SMTP_HOST=${SMTP_HOST:-smtp.resend.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-resend}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://birthday.${DOMAIN}}
      - SEO_ALLOW_INDEXING=${SEO_ALLOW_INDEXING:-true}
      - TRUST_PROXY=${TRUST_PROXY:-1}
    volumes:
      - birthday_db:/app/data
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.birthday-invitation.entrypoints=websecure"

      - "traefik.http.routers.birthday-invitation.rule=Host(`birthday.${DOMAIN}`)"

      - "traefik.http.services.birthday-invitation.loadBalancer.server.port=3000"

    networks:
      lan:

  backup:
    image: alpine:3
    container_name: birthday-invitation-backup
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - DB_PATH=/app/data/rsvp.db
      - BACKUP_DIR=/backup
      - BACKUP_KEEP=${BACKUP_KEEP:-14}
      - BACKUP_INTERVAL=${BACKUP_INTERVAL:-86400}
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache sqlite >/dev/null && exec /backup.sh"]
    volumes:
      - birthday_db:/app/data
      - birthday_backups:/backup
      - ./infra/backup.sh:/backup.sh:ro
    networks:
      lan:


volumes:
  birthday_db:
    driver: local
  birthday_backups:
    driver: local

networks:
  lan:
    external: true
