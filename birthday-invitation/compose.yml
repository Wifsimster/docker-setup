name: birthday-invitation

services:
  birthday-invitation:
    image: ghcr.io/wifsimster/birthday-invitation:latest
    container_name: birthday-invitation
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - NODE_ENV=production
      - BIRTHDAY_PERSON=${BIRTHDAY_PERSON}
      - BIRTHDAY_AGE=${BIRTHDAY_AGE}
      - EVENT_DATE=${EVENT_DATE}
      - EVENT_TIME=${EVENT_TIME}
      - EVENT_TOWN=${EVENT_TOWN}
      - EVENT_LOCATION=${EVENT_LOCATION}
      - DRESS_CODE=${DRESS_CODE}
      # Optional "respond by" date (YYYY-MM-DD); closes RSVPs once passed.
      - EVENT_RSVP_DEADLINE=${EVENT_RSVP_DEADLINE:-}
      - DB_PATH=/app/data/rsvp.db
      # Bootstrap admin (Better Auth). This account is seeded on first start and
      # re-granted the admin role on every boot, so the operator can't be locked
      # out. Everyone else registers themselves and is promoted from /admin.
      # BETTER_AUTH_SECRET signs the session cookies and BETTER_AUTH_URL is the
      # external origin used for cookie/origin scoping.
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_NAME=${ADMIN_NAME:-Admin}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://birthday.${DOMAIN}}
      # Transactional email (Resend SMTP), used for the sign-up verification and
      # password-reset links. Required: sign-up cannot complete without it, and
      # the server refuses to start in production when unset.
      - MAIL_FROM=${MAIL_FROM}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SMTP_HOST=${SMTP_HOST:-smtp.resend.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-resend}
      # Google sign-in. Leave both blank to hide the button entirely.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # Restrict cross-origin API access (comma-separated). Empty = same-origin only.
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      # Public origin used for canonical / og:url / sitemap links, and the
      # opt-out that keeps the invitation out of search engines.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://birthday.${DOMAIN}}
      - SEO_ALLOW_INDEXING=${SEO_ALLOW_INDEXING:-true}
      # Proxy hops in front of the backend (Traefik -> Node) so that per-IP
      # rate limiting sees the real client address.
      - TRUST_PROXY=${TRUST_PROXY:-1}
    volumes:
      - birthday_db:/app/data
    labels:
      - "traefik.enable=true"

      # Entrypoint
      - "traefik.http.routers.birthday-invitation.entrypoints=websecure"

      # Router
      - "traefik.http.routers.birthday-invitation.rule=Host(`birthday.${DOMAIN}`)"

      # Service
      - "traefik.http.services.birthday-invitation.loadBalancer.server.port=3000"

    networks:
      lan:

  # Sidecar that takes periodic consistent snapshots of the SQLite database to a
  # separate volume — the DB is the only copy of every RSVP. Restore by copying a
  # rsvp-*.db snapshot back over /app/data/rsvp.db (stop the app first).
  backup:
    image: alpine:3
    container_name: birthday-invitation-backup
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - DB_PATH=/app/data/rsvp.db
      - BACKUP_DIR=/backup
      - BACKUP_KEEP=${BACKUP_KEEP:-14}
      - BACKUP_INTERVAL=${BACKUP_INTERVAL:-86400}
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache sqlite >/dev/null && exec /backup.sh"]
    volumes:
      # Read-write so SQLite can create the WAL shared-memory file when opening
      # the database to snapshot it; the backup script only ever reads.
      - birthday_db:/app/data
      - birthday_backups:/backup
      - ./infra/backup.sh:/backup.sh:ro
    networks:
      lan:


volumes:
  birthday_db:
    driver: local
  birthday_backups:
    driver: local

networks:
  lan:
    external: true
