name: Wyoming Piper

services:
  piper:
    container_name: wyoming-piper
    image: rhasspy/wyoming-piper:latest
    restart: unless-stopped
    command: --voice fr_FR-siwis-medium
    ports:
      - "10200:10200"
    volumes:
      - /opt/docker/wyoming-piper/data:/data
    environment:
      TZ: ${TZ:-Europe/Paris}
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
