- id: broadlink_rm4_health_alert
  alias: Alerte - Broadlink RM4 disponibilité
  description: Journalise (sans push/son) quand la télécommande RF/IR Broadlink
    RM4 passe hors ligne ou revient ; repris dans le rapport du dimanche.
  triggers:
  - platform: state
    entity_id: remote.universal_remote
    to: unavailable
    for:
      minutes: 3
    id: offline
  - platform: state
    entity_id: remote.universal_remote
    from: unavailable
    id: online
  conditions:
  - condition: template
    value_template: '{{ trigger.id == ''offline'' or trigger.to_state.state not in
      [''unavailable'', ''unknown''] }}'
  actions:
