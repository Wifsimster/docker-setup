  - trigger: time
    at: 07:20:00
    id: ecole
  - trigger: time
    at: 09:00:00
    id: repos
  conditions:
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: trigger
        id: ecole
      - condition: time
        weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
      - alias: Pas un jour férié
        condition: state
        entity_id: binary_sensor.jour_non_ferie
        state: 'on'
      - alias: Hors vacances scolaires
        condition: state
        entity_id: input_boolean.vacances_scolaires
        state: 'off'
    - condition: and
      conditions:
      - condition: trigger
        id: repos
      - alias: 'Jour sans routine : week-end, férié ou vacances scolaires'
        condition: template
        value_template: '{{ now().weekday() in [5, 6] or is_state(''binary_sensor.jour_non_ferie'',
          ''off'') or is_state(''input_boolean.vacances_scolaires'', ''on'') }}'
  - alias: 'Maison vide : aucun mouvement de volet'
    condition: state
    entity_id: input_boolean.maison_absente
    state: 'off'
  actions:
  - alias: Ouvrir les 6 volets (groupe cover.tous_les_volets)
    action: cover.open_cover
    target:
      entity_id: cover.tous_les_volets
  mode: single
- id: '1789718245832'
  alias: Visiophone - Quelqu'un sonne
  description: Déclenché par l'appui sur la platine de rue (Dahua VTO2202F). L'événement
    ne vient pas de l'ONVIF mais du pont MQTT visiophone-bridge.
  triggers:
  - trigger: state
    entity_id: event.visiophone_appel
    attribute: event_type
    to: sonnerie
  conditions: []
  actions:
  - alias: Notification avec la vue de la platine
    action: notify.all_mobiles
    data:
      title: "\U0001F514 Quelqu'un sonne"
      message: Appel au portail
      data:
        image: /api/camera_proxy/camera.sonnerie_mediaprofile_channel1_mainstream
        channel: Visiophone
        importance: high
        ttl: 0
        priority: high
        tag: visiophone
        actions:
        - action: VISIO_OUVRIR
          title: Ouvrir
        - action: URI
          title: Voir
          uri: /lovelace/0
  - alias: Annonce sur les Sonos
    action: script.annonce
    data:
      message: Quelqu'un sonne à la porte
      piece: toutes
      volume: 55
