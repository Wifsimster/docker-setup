- id: '1789718255693'
  alias: Visiophone - Ouvrir depuis la notification
  description: Réponse au bouton « Ouvrir » de la notification mobile envoyée par
    « Visiophone - Quelqu'un sonne ».
  triggers:
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
