      message: Le portail a été refermé automatiquement.
      piece: salon
      volume: 45
      nuit: true
  mode: restart
- id: '1709300000001'
  alias: Sécurité - Personne détectée la nuit
  description: Notification push + image caméra quand une personne est détectée par
    les caméras extérieures la nuit OU lorsque la maison est en mode Absence (jour
    comme nuit).
  triggers:
  - trigger: state
    entity_id: binary_sensor.camera_garage_person_detected
    to: 'on'
    id: allee
  - trigger: state
    entity_id: binary_sensor.camera_portail_person_detected
    to: 'on'
    id: portail
  - trigger: state
    entity_id: binary_sensor.g5_bullet_personne_detectee
    to: 'on'
    id: g5_bullet
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: sun.sun
      state: below_horizon
    - condition: state
      entity_id: input_boolean.maison_absente
      state: 'on'
  - condition: or
    conditions:
    - condition: state
      entity_id: input_boolean.maison_absente
      state: 'on'
    - condition: not
      conditions:
      - condition: time
        after: '07:00:00'
        before: '08:30:00'
        weekday: [mon, tue, wed, thu, fri]
  actions:
  - action: notify.all_mobiles
    data:
      title: Personne détectée
      message: Une personne a été détectée par {% if trigger.id == 'allee' %}la caméra
        Allée {% elif trigger.id == 'portail' %}la caméra Portail {% else %}la caméra
        G5 Bullet{% endif %}
      data:
        image: '{% if trigger.id == ''allee'' %}/api/camera_proxy/camera.camera_allee_medium_resolution_channel
          {% elif trigger.id == ''portail'' %}/api/camera_proxy/camera.camera_portail_medium_resolution_channel
          {% else %}/api/camera_proxy/camera.g5_bullet_high_resolution_channel{% endif
          %}'
        priority: high
        ttl: 0
        channel: alarm_stream
        importance: high
  - action: script.annonce
    data:
      message: 'Attention : présence détectée à l''extérieur.'
      piece: salon
      volume: 60
      nuit: true
  mode: single
  max_exceeded: warning
