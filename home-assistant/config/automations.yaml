- id: '1789274000001'
  alias: Salon - TV coupée le soir (semaine)
  description: 'Routine Léo : extinction à 19h30 tous les soirs sauf le samedi (dim,
    lun, mar, mer, jeu, ven). Coupée aussi la veille d''un jour férié (décision 2026-09-23)
    : les vacances scolaires sont la SEULE exception. La TV est d''abord mise en VEILLE
    (media_player.tv_salon) avant la coupure de la prise : elle retrouve ainsi l''état
    veille quand la prise est rallumée à 20h30 (au lieu de redémarrer avec le son
    de la barre).'
  triggers:
  - trigger: time
    at: '19:30:00'
  conditions:
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
    - sun
  - alias: Hors vacances scolaires
    condition: state
    entity_id: input_boolean.vacances_scolaires
    state: 'off'
  actions:
  - alias: Mettre la TV en veille avant de couper
    if:
    - condition: state
      entity_id: media_player.tv_salon
      state: 'on'
    then:
    - action: media_player.turn_off
      target:
        entity_id: media_player.tv_salon
      continue_on_error: true
    - delay:
        seconds: 15
  - action: switch.turn_off
    target:
      entity_id: switch.prise_television
  mode: single
- id: '1789274000002'
  alias: Salon - TV rallumée pour les parents (20h30)
  description: 'Rallume la PRISE TV à 20h30 les soirs où elle a été coupée (dim, lun,
    mar, mer, jeu, ven). JAMAIS avant 20h30. Coupée aussi la veille d''un jour férié
    (décision 2026-09-23) : les vacances scolaires sont la SEULE exception. Rallumer
    la prise ne doit PAS rallumer l''écran ni le son (enfants endormis) : si la TV
    démarre d''elle-même dans les 3 min, elle est remise en veille (2 tentatives)
    ; la barre de son suit via HDMI-CEC.'
  triggers:
  - trigger: time
    at: '20:30:00'
  conditions:
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
    - sun
  - alias: Hors vacances scolaires
    condition: state
    entity_id: input_boolean.vacances_scolaires
    state: 'off'
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.prise_television
  - alias: La TV redémarre-t-elle toute seule ?
    wait_for_trigger:
    - trigger: state
      entity_id: media_player.tv_salon
      to: 'on'
    timeout:
      minutes: 3
    continue_on_timeout: true
  - if:
    - condition: template
      value_template: '{{ wait.trigger is not none }}'
    then:
    - delay:
        seconds: 10
    - action: media_player.turn_off
      target:
        entity_id: media_player.tv_salon
      continue_on_error: true
    - delay:
        seconds: 30
    - alias: Seconde tentative si l'écran a ignoré la 1re
      if:
      - condition: state
        entity_id: media_player.tv_salon
        state: 'on'
      then:
      - action: media_player.turn_off
        target:
          entity_id: media_player.tv_salon
        continue_on_error: true
  mode: single
