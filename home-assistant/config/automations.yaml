  alias: Portail - Fermeture automatique la nuit apres 1h
  description: Ferme le portail s'il est ouvert depuis plus de 1h la nuit. Nuit =
    sun.sun below_horizon (fiable, independant des cameras). Se declenche a l'ouverture
    la nuit OU au coucher du soleil si deja ouvert.
  triggers:
  - trigger: state
    entity_id: switch.sonoff_100259f3b2_1
    to: 'on'
  - trigger: state
    entity_id: sun.sun
    to: below_horizon
  conditions:
  - condition: state
    entity_id: switch.sonoff_100259f3b2_1
    state: 'on'
  - condition: state
    entity_id: sun.sun
    state: below_horizon
  actions:
  - delay:
      hours: 1
  - condition: state
    entity_id: switch.sonoff_100259f3b2_1
    state: 'on'
  - condition: not
    conditions:
    - condition: time
      after: '06:30:00'
      before: '08:30:00'
      weekday: thu
  - action: switch.turn_on
    target:
      entity_id: switch.sonoff_100259b4c3_1
  - delay:
      seconds: 30
  - action: switch.turn_off
    target:
      entity_id: switch.sonoff_100259b4c3_1
  - action: notify.all_mobiles
