- id: '1789274000005'
  alias: Enfants - Lever
  description: 'Réveil à 07h15 du lundi au vendredi. Mercredi : mêmes horaires, Léo
    va au centre aéré et Anna reste à la maison avec sa maman. Ne tourne pas si input_boolean.maison_absente
    est on.'
  triggers:
  - trigger: time
    at: 07:15:00
  conditions:
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  - alias: Pas un jour férié
    condition: state
    entity_id: binary_sensor.jour_non_ferie
    state: 'on'
  - alias: Hors vacances scolaires
    condition: state
    entity_id: input_boolean.vacances_scolaires
    state: 'off'
  - alias: Maison occupée (pas de routine si maison vide)
    condition: state
    entity_id: input_boolean.maison_absente
    state: 'off'
  actions:
  - choose:
    - alias: 'Enceinte joignable : réveil en musique, puis consigne'
      conditions:
      - condition: template
        value_template: '{{ has_value(''media_player.sonos_chambre_leo'') }}'
      sequence:
      - alias: 'Montée progressive 1/5 : départ en douceur à 10 %'
        action: media_player.volume_set
        target:
          entity_id: media_player.sonos_chambre_leo
        data:
          volume_level: 0.1
      - alias: 'Réveil en musique : playlist Sonos « Pat Patrouille »'
        action: media_player.play_media
        target:
          entity_id: media_player.sonos_chambre_leo
        data:
          media_content_type: playlist
          media_content_id: Pat Patrouille
      - delay:
          seconds: 20
      - alias: 'Montée progressive 2/5 : 15 % à T+20 s'
        action: media_player.volume_set
        target:
          entity_id: media_player.sonos_chambre_leo
        data:
          volume_level: 0.15
      - delay:
          seconds: 20
      - alias: 'Montée progressive 3/5 : 20 % à T+40 s'
        action: media_player.volume_set
        target:
          entity_id: media_player.sonos_chambre_leo
        data:
          volume_level: 0.2
      - delay:
          seconds: 20
      - alias: 'Montée progressive 4/5 : 25 % à T+60 s'
        action: media_player.volume_set
        target:
          entity_id: media_player.sonos_chambre_leo
        data:
          volume_level: 0.25
      - delay:
          seconds: 20
      - alias: 'Montée progressive 5/5 : 30 % à T+80 s (palier final)'
        action: media_player.volume_set
        target:
          entity_id: media_player.sonos_chambre_leo
        data:
          volume_level: 0.3
      - alias: Laisser la musique finir de réveiller Léo avant de parler
        delay:
          seconds: 10
      - action: script.annonce
        data:
          message: Léo, debout. Sept heures quinze. Tu t'habilles d'abord.
          piece: leo
          volume: 25
    default:
    - alias: 'Repli : prévenir les parents, le réveil n''a pas eu lieu'
      action: notify.all_mobiles
      data:
        title: ⚠️ Réveil de Léo non diffusé
        message: 'L''enceinte de la chambre de Léo est injoignable (état : {{ states(''media_player.sonos_chambre_leo'')
          }}). Le réveil de {{ now().strftime(''%H:%M'') }} n''a PAS été diffusé —
          personne n''a été réveillé.'
        data:
          priority: high
          ttl: 0
    - action: persistent_notification.create
      data:
        notification_id: reveil_leo_non_diffuse
        title: ⚠️ Réveil de Léo non diffusé
        message: 'L''enceinte de la chambre de Léo est injoignable (état : {{ states(''media_player.sonos_chambre_leo'')
          }}). Le réveil de {{ now().strftime(''%H:%M'') }} n''a PAS été diffusé —
          personne n''a été réveillé.'
  mode: single
