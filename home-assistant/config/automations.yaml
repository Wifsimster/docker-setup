- id: '1789318600001'
  alias: Vacances scolaires - synchro calendrier Bordeaux
  description: 'Aligne input_boolean.vacances_scolaires sur le calendrier officiel
    de l''academie de Bordeaux (zone A, data.education.gouv.fr via binary_sensor.vacances_scolaires_bordeaux).
    Bascule manuelle toujours possible : elle sera reprise a la prochaine verification.'
  triggers:
  - trigger: state
    entity_id: binary_sensor.vacances_scolaires_bordeaux
    to:
    - 'on'
    - 'off'
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    hours: /1
  conditions:
  - alias: Le capteur calendrier repond
    condition: template
    value_template: '{{ states(''binary_sensor.vacances_scolaires_bordeaux'') in [''on'',''off'']
      }}'
  - alias: Etat different de l'interrupteur
    condition: template
    value_template: '{{ states(''binary_sensor.vacances_scolaires_bordeaux'') != states(''input_boolean.vacances_scolaires'')
      }}'
  actions:
  - action: '{{ ''input_boolean.turn_on'' if is_state(''binary_sensor.vacances_scolaires_bordeaux'',''on'')
      else ''input_boolean.turn_off'' }}'
    target:
      entity_id: input_boolean.vacances_scolaires
  - action: notify.all_mobiles
    data:
      title: Vacances scolaires
      message: '{% if is_state(''binary_sensor.vacances_scolaires_bordeaux'',''on'')
        %}Debut des {{ state_attr(''binary_sensor.vacances_scolaires_bordeaux'',''periode'')
        }} : routines ecole desactivees jusqu''au {{ state_attr(''binary_sensor.vacances_scolaires_bordeaux'',''fin'')
        }}.{% else %}Fin des vacances : les routines ecole (coupure TV 19h30, reveil)
        reprennent.{% endif %}'
  mode: single
- id: '1758434561000'
  alias: Salon - Veilleuse meuble (soir/matin)
  description: Allume la lumière meuble (veilleuse salon/couloir) quand la routine
    'Maison - Fermeture des volets le soir' se déclenche (tous les soirs, sans condition
    de calendrier), l'éteint quand la routine 'Maison - Ouverture des volets le matin'
    se déclenche (maison réveillée).
  triggers:
  - trigger: event
    event_type: automation_triggered
    event_data:
      entity_id: automation.maison_fermeture_des_volets_le_soir
    id: soir
  - trigger: event
    event_type: automation_triggered
    event_data:
      entity_id: automation.maison_ouverture_des_volets_le_matin
    id: matin
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: soir
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.salon_lumiere_ambiance_salle_a_manger
    - conditions:
      - condition: trigger
        id: matin
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.salon_lumiere_ambiance_salle_a_manger
  mode: single
- id: '1790062993718'
  alias: Portail - Alerte ouvert depuis plus d'une heure
  description: Alerte le jour si le portail reste ouvert plus d'1h, avec un bouton
    pour le refermer depuis la notification. La nuit est deja couverte par l'avertissement
    30 min et la fermeture auto apres 1h (voir automation.portail_avertissement_ouvert_depuis_30_min_la_nuit
    et automation.portail_fermeture_automatique_la_nuit_apres_1h).
  triggers:
  - trigger: state
    entity_id: switch.sonoff_100259f3b2_1
    to: 'on'
    for:
      hours: 1
  conditions:
  - condition: state
    entity_id: sun.sun
    state: above_horizon
  actions:
  - action: notify.all_mobiles
    data:
      title: Portail ouvert
      message: Le portail est ouvert depuis plus d'une heure.
      data:
        priority: high
        importance: high
        ttl: 0
        tag: portail_ouvert_1h
        channel: Portail
        actions:
        - action: PORTAIL_FERMER
          title: Fermer le portail
  mode: single
- id: '1790063571937'
  alias: Portail - Fermer depuis la notification
  description: Reponse au bouton « Fermer le portail » de la notification envoyee
    par « Portail - Alerte ouvert depuis plus d'une heure ». Meme sequence de pulse
    que les autres fermetures automatiques (relais Fermeture 30s).
  triggers:
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: PORTAIL_FERMER
  conditions:
  - alias: Portail encore ouvert
    condition: state
    entity_id: switch.sonoff_100259f3b2_1
    state: 'on'
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.sonoff_100259b4c3_1
  - delay:
      seconds: 30
  - action: switch.turn_off
    target:
      entity_id: switch.sonoff_100259b4c3_1
  - action: notify.all_mobiles
    data:
      title: Portail referme
      message: Le portail a ete referme depuis la notification.
      data:
        priority: normal
  mode: single
- id: christelle_arrivee_annonce
  alias: Christelle - Annonce de son arrivée
  description: 'Une seule fois par trajet : quand Christelle repasse sous 8 km de la
    maison en se rapprochant (Proximity), annonce sur les Sonos « Christelle arrive
    dans environ X minutes » si Damien est là et entre 08h00 et 23h00, et push discret
    à Damien (toujours). X = distance / vitesse d''approche entre les deux derniers
    relevés GPS (45 km/h par défaut). Waze Travel Time n''est pas utilisable (API Waze
    en 403 depuis HA, 2026-10-03). Réarmée quand Christelle repasse par la maison ou
    après 2 h. Les trajets de moins de 8 km ne déclenchent rien.'
  triggers:
  - trigger: numeric_state
    entity_id: sensor.maison_distance_avec_christelle
    below: 8000
  conditions:
  - condition: state
    entity_id: sensor.maison_direction_du_deplacement_de_christelle
    state: towards
  - condition: not
    conditions:
    - condition: state
      entity_id: person.christelle
      state: home
  - alias: Partie de la maison depuis au moins 5 min (pas un aller-retour express)
    condition: template
    value_template: '{{ (now() - states.person.christelle.last_changed).total_seconds()
      > 300 }}'
  - alias: Une seule annonce par trajet (réarmée au retour à la maison ou après 2 h)
    condition: template
    value_template: '{% set lt = this.attributes.last_triggered %}{{ lt is none or
      states.person.christelle.last_changed > lt or (now() - lt).total_seconds() > 7200
      }}'
  variables:
    minutes: "{%- set d = trigger.to_state.state | float(0) / 1000 -%}\n{%- set d0 = trigger.from_state.state
      | float(0) / 1000 if trigger.from_state else 0 -%}\n{%- set dt = (as_timestamp(trigger.to_state.last_changed)
      - as_timestamp(trigger.from_state.last_changed)) if trigger.from_state else 0 -%}\n\
      {%- set v = (d0 - d) / (dt / 60) if dt > 0 and d0 > d else 0 -%}\n{%- set v =
      v if 0.17 <= v <= 2.2 else 0.75 -%}\n{{ [1, (d / v) | round(0) | int] | max }}"
    phrase: Christelle arrive dans environ {{ minutes }} minute{{ 's' if minutes | int
      > 1 else '' }}.
  actions:
  - action: notify.mobile_app_telephone_damien
    data:
      title: "\U0001F697 Christelle arrive"
      message: '{{ phrase }}'
      data:
        tag: christelle_arrivee
        importance: low
  - if:
    - condition: state
      entity_id: person.wifsimster
      state: home
    - condition: time
      after: 08:00:00
      before: '23:00:00'
    then:
    - action: script.annonce
      data:
        message: '{{ phrase }}'
        piece: toutes
        volume: 40
  mode: single
- id: christelle_arrivee_effacer
  alias: Christelle - Effacer le push d'arrivée
  description: Retire le push « Christelle arrive » du téléphone de Damien quand elle
    est à la maison.
  triggers:
  - trigger: state
    entity_id: person.christelle
    to: home
  actions:
  - action: notify.mobile_app_telephone_damien
    data:
      message: clear_notification
      data:
        tag: christelle_arrivee
  mode: single
