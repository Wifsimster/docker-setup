- id: '1709300000004'
  alias: Batterie faible - Annonce capteurs
  description: Une seule annonce par jour (18h30, salon) listant les capteurs à pile
    faible (<20 %) ou vide (<5 %, ou injoignable depuis 24 h), avec leur pièce. Remplace
    l'ancienne notif mobile + annonce générique + alerte n8n <5 %. Filtre sur device_class
    battery (les entités Zigbee s'appellent *_batterie), téléphones mobile_app exclus.
  triggers:
  - trigger: time
    at: '18:30:00'
  conditions:
  - condition: template
    value_template: '{{ message | length > 0 }}'
  actions:
  - action: script.annonce
    data:
      message: '{{ message }}'
      piece: salon
      volume: 40
      nuit: false
  variables:
    message: "{%- set mobiles = integration_entities('mobile_app') -%}\n{%- set ns
      = namespace(vides=[], faibles=[]) -%}\n{%- for s in states.sensor | selectattr('attributes.device_class',
      'defined') | selectattr('attributes.device_class', 'eq', 'battery') if s.entity_id
      not in mobiles -%}\n  {%- set nom = device_attr(s.entity_id, 'name_by_user')
      or device_attr(s.entity_id, 'name') or s.name -%}\n  {%- set nom = nom | trim
      -%}\n  {%- set piece = area_name(s.entity_id) -%}\n  {%- set lieu = nom if (not
      piece or piece | lower in nom | lower) else nom ~ ' (' ~ piece ~ ')' -%}\n  {%-
      if s.state in ['unavailable', 'unknown'] -%}\n    {%- if now() - s.last_changed
      > timedelta(hours=24) -%}{%- set ns.vides = ns.vides + [lieu] -%}{%- endif -%}\n
      \ {%- elif s.state | float(100) < 5 -%}\n    {%- set ns.vides = ns.vides + [lieu]
      -%}\n  {%- elif s.state | float(100) < 20 -%}\n    {%- set ns.faibles = ns.faibles
      + [lieu ~ ' à ' ~ (s.state | float | int) ~ ' %'] -%}\n  {%- endif -%}\n{%-
      endfor -%}\n{%- set parts = [] -%}\n{%- if ns.vides -%}{%- set parts = parts
      + ['Pile vide : ' ~ ns.vides | join(', ')] -%}{%- endif -%}\n{%- if ns.faibles
      -%}{%- set parts = parts + ['Pile faible : ' ~ ns.faibles | join(', ')] -%}{%-
      endif -%}\n{{ parts | join('. ') ~ ('.' if parts else '') }}"
  mode: single
