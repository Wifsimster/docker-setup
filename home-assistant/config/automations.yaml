  alias: Salon - Annonce avant extinction TV
  description: 'Prévient Léo 5 minutes avant la coupure de 19h30 (dim, lun, mar, jeu,
    ven). PAS le mercredi : à 19h25 Léo est en devoirs (Enfants - Devoirs se déclenche
    à la même minute), deux consignes d''affilée contreviendraient à la grille. La
    coupure et le rallumage de la prise gardent, eux, le mercredi. Coupée aussi la
    veille d''un jour férié (décision 2026-09-23) : les vacances scolaires sont la
    SEULE exception.'
  triggers:
  - trigger: time
    at: '19:25:00'
  conditions:
  - condition: time
    weekday:
    - mon
    - tue
    - thu
    - fri
    - sun
