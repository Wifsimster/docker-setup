name: coffre

services:
  coffre:
    build:
      context: /home/wifsimster/coffre-src
      dockerfile: Dockerfile
    image: coffre:local
    container_name: coffre
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=Europe/Paris
    volumes:
      # Live progress page, editable between rounds without rebuilding.
      - ./progress:/usr/share/nginx/html/progress:ro
    labels:
      - "traefik.enable=true"

      # Entrypoint
      - "traefik.http.routers.coffre.entrypoints=websecure"

      # Router
      - "traefik.http.routers.coffre.rule=Host(`coffre.${DOMAIN}`)"

      # Service
      - "traefik.http.services.coffre.loadBalancer.server.port=80"

      # Security headers, shared middleware defined on the Traefik container
      - "traefik.http.routers.coffre.middlewares=secHeaders@docker"

    networks:
      lan:

networks:
  lan:
    external: true

