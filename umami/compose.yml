name: umami

services:
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      - TZ=Europe/Paris
      - DATABASE_TYPE=postgresql
      - DATABASE_URL=postgresql://${DB_USER:-umami}:${DB_PASSWORD}@umami-db:5432/${DB_NAME:-umami}
      - APP_SECRET=${APP_SECRET}
      - DISABLE_TELEMETRY=1
      - TRACKER_SCRIPT_NAME=script.js,stats.js
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/heartbeat >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    depends_on:
      umami-db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.umami.entrypoints=websecure"
      - "traefik.http.routers.umami.rule=Host(`umami.${DOMAIN}`)"
      - "traefik.docker.network=lan"
      - "traefik.http.routers.umami.tls=true"
      - "traefik.http.routers.umami.tls.certresolver=letsencrypt"
      - "traefik.http.services.umami.loadBalancer.server.port=3000"
      - "watchtower.enable=true"
    networks:
      lan:
      backend:

  umami-db:
    image: postgres:16-alpine
    container_name: umami-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - POSTGRES_USER=${DB_USER:-umami}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-umami}
      - PGDATA=/var/lib/postgresql/data/pgdata
      - TZ=Europe/Paris
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-umami}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      backend:

volumes:
  umami-db-data:

networks:
  lan:
    external: true
  backend:
    internal: true
